# Toon-o-Matic — configuration de l'usine
# Chaque bloc a un "provider" interchangeable. "mock" = fonctionne sans GPU ni clé API
# (utile pour tester la chaîne complète en CI ou sur un laptop).

series: series/les-voisins   # dossier de la série active (bible, distribution, mémoire)
workdir: runs                 # un dossier par épisode : runs/<episode_id>/
database: runs/toonomatic.sqlite

state:
  backend: sqlite             # sqlite (une machine) | vault (cloud : l'état vit dans le VAULT)

vault:                        # mémoire permanente : séries, personnages, épisodes, file d'attente
  backend: local              # local | s3 (Cloudflare R2, AWS S3, MinIO, Backblaze B2…)
  path: vault
  s3:
    bucket: toonomatic
    endpoint_url: ""          # R2 : https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    region: auto
    access_key_env: VAULT_ACCESS_KEY_ID
    secret_key_env: VAULT_SECRET_ACCESS_KEY

# Trois niveaux : on ne paie le rendu final que pour une histoire déjà validée.
production:
  default_tier: draft
  tiers:
    draft:                    # BROUILLON : histoire, rythme, gags — coût quasi nul, CPU seulement
      gpu: false
      overrides:
        tts: {provider: piper, fallback: mock}
        lipsync: {provider: envelope}
        animation: {renderer: puppet, resolution: [854, 480]}   # marionnettes 2D : vrai dessin animé sur CPU
        plates: {provider: draw}
        editing: {cutdown: {enabled: false}}
        package: {enabled: false}
        stickers: {enabled: false}
        presence: {enabled: false}
    validation:               # VALIDATION : vraies voix, personnages et mouvements en 3D basse définition
      gpu: false
      overrides:
        animation:
          renderer: blender
          resolution: [960, 540]
          blender: {engine: CYCLES, samples: 4, animate_on_twos: true, parallel_jobs: 2}
        package: {enabled: false}
        stickers: {enabled: false}
        presence: {enabled: false}
    final:                    # FINAL : rendu HD sur GPU à la demande, kit de publication
      gpu: true
      overrides:
        animation: {renderer: blender}

package:
  enabled: true

command:                      # serveur de commande (téléphone)
  token_env: TOONOMATIC_TOKEN # obligatoire dès que le serveur est public

studio:                       # machines de production, lancées à la demande
  cpu_launcher: inline        # inline (thread sur le serveur) | command | webhook | none
  gpu_launcher: none          # none = ne JAMAIS louer de GPU tant que ce n'est pas configuré
  cpu_command: ""
  gpu_command: ""             # ex. "ssh gpu-box 'cd toonomatic && toonomatic -c config/cloud.yaml worker --gpu'"
  webhook: {url: "", token_env: STUDIO_WEBHOOK_TOKEN}

brand:                        # contrôle de marque : reconnaissable en 0,5 s, même en vignette
  max_silhouette_iou: 0.8     # au-delà, deux silhouettes (64 px) sont jugées confondables
  min_color_delta_e: 25       # écart minimal entre couleurs signatures (ΔE Lab)
  min_background_delta_e: 15  # un personnage ne doit pas se fondre dans le décor
  render_px: 512
  engine: CYCLES              # fonctionne sans GPU
  samples: 2

presence:                     # PRESENCE ENGINE : une scène → scène, réaction, short, stickers, FR/EN
  enabled: true
  scenes_per_episode: 2       # à la demande : seules les meilleures scènes sont déclinées
  stickers_per_scene: 2
  reaction_max_s: 10
  short_max_s: 59

social:                       # mémoire sociale
  min_samples: 5              # en dessous : « données insuffisantes », aucune décision automatique

stickers:                     # packs WhatsApp / Telegram extraits des épisodes validés
  enabled: true
  per_episode: 6
  render_px: 768
  engine: CYCLES
  samples: 8

director:                     # réalisateur automatique : relit, note, corrige de façon ciblée
  enabled: true
  max_rounds: 2               # passes de correction automatique avant la revue humaine
  min_score: 6                # note /10 sous laquelle un critère déclenche une correction
  max_chars_per_second: 19    # débit au-delà duquel une réplique devient incompréhensible

cadence:
  episodes_per_day: 2         # 1 à 4
  timezone: Europe/Paris

episode:
  target_minutes: 12          # durée visée (10–15 min)
  min_minutes: 10
  max_minutes: 15
  minutes_per_scene: 1.3      # granularité du découpage (≈ 8–12 scènes)
  max_extension_rounds: 3     # passes d'allongement si l'épisode est trop court

languages:                    # une version par langue, écrite par un showrunner distinct
  fr:
    showrunner: config/showrunners/fr.md
    words_per_minute: 165
    subtitle_translation_to: [en]
  en:
    showrunner: config/showrunners/en_uk.md   # ou en_us.md (plus rythmé)
    words_per_minute: 160
    subtitle_translation_to: [fr]

ideas:
  bank: data/situations.yaml  # banque de situations / gags pré-écrits
  trend_feeds: []             # ex. ["https://trends.google.com/trending/rss?geo=FR"]
  avoid_repeat_days: 60

llm:
  provider: mock              # mock | auto | chain | claude | ollama
  # SALLE D'ÉCRITURE open source : tout serveur « compatible OpenAI ». Un point d'accès n'est
  # utilisé que si sa clé est présente ; quota épuisé chez l'un → le suivant prend le relais.
  # `auto` = ces points d'accès, puis Claude si ANTHROPIC_API_KEY existe.
  # Les noms de modèles et quotas gratuits changent : surchargez-les par variable (ex. GROQ_MODEL).
  chain: [mistral, groq, openrouter, nvidia, ollama_cloud]
  routes:                     # ordre de préférence par langue : deux plumes différentes
    fr: [mistral, groq]       # Mistral (modèles français) pour l'humour français
    en: [groq, mistral]
  endpoints:
    mistral:      {base_url: "https://api.mistral.ai/v1",      model: mistral-small-latest, model_env: MISTRAL_MODEL,    api_key_env: MISTRAL_API_KEY}
    groq:         {base_url: "https://api.groq.com/openai/v1", model: openai/gpt-oss-120b,  model_env: GROQ_MODEL,       api_key_env: GROQ_API_KEY}
    openrouter:   {base_url: "https://openrouter.ai/api/v1",   model: "meta-llama/llama-3.3-70b-instruct:free", model_env: OPENROUTER_MODEL, api_key_env: OPENROUTER_API_KEY, json_schema: false}
    nvidia:       {base_url: "https://integrate.api.nvidia.com/v1", model: meta/llama-3.3-70b-instruct, model_env: NVIDIA_MODEL, api_key_env: NVIDIA_API_KEY, json_schema: false}
    ollama_cloud: {base_url: "https://ollama.com/v1",          model: gpt-oss:120b,         model_env: OLLAMA_MODEL,     api_key_env: OLLAMA_API_KEY, json_schema: false}
    # Ollama sur VOTRE machine (aucune clé) — à ajouter dans `chain` si un serveur Ollama est joignable :
    # ollama_local: {base_url: "http://localhost:11434/v1", model: mistral-nemo}
  claude:
    model: claude-opus-5-5
    effort: high
    max_tokens: 64000
    server_side_fallback: true   # repli automatique si un modèle décline une requête
  ollama:
    host: http://localhost:11434
    model: mistral-nemo
    timeout_s: 600

tts:
  provider: mock              # mock | chatterbox | xtts | bark | http | elevenlabs
  sample_rate: 48000
  xtts:
    model: tts_models/multilingual/multi-dataset/xtts_v2
    device: cuda
  bark:
    device: cuda
  piper:                      # voix « brouillon » : très rapide sur CPU, gratuite (rhasspy/piper)
    executable: piper
    models: {fr: assets/piper/fr_FR-siwis-medium.onnx, en: assets/piper/en_GB-alan-medium.onnx}
  chatterbox:
    device: cuda
    cfg_weight: 0.4           # plus bas = débit plus lent et posé
  http:                       # serveur auto-hébergé (Fish Speech, F5-TTS, CosyVoice, Zonos…)
    url: ""
    json: {text: "{text}", reference_audio: "{ref}", language: "{lang}"}
    response: audio
  elevenlabs:
    model_id: eleven_multilingual_v2
    api_key_env: ELEVENLABS_API_KEY

plates:                       # décors 2D (styles avec backgrounds: plates)
  provider: mock              # mock (dégradé de test) | draw (décors dessinés par le code) | http (serveur d'images) | none
  negative_prompt: "people, characters, text, watermark, logo, blurry"
  http:                       # défaut : API Automatic1111 / Forge ; adaptez pour ComfyUI, FLUX…
    url: http://localhost:7860/sdapi/v1/txt2img
    json: {prompt: "{prompt}", negative_prompt: "{negative}", width: 1344, height: 768, steps: 28}
    response_field: images

lipsync:
  provider: auto              # auto | rhubarb | envelope
  rhubarb_path: rhubarb       # https://github.com/DanielSWolf/rhubarb-lip-sync (binaire)

animation:
  renderer: preview           # preview (blocs, test) | puppet (marionnettes 2D, CPU) | blender (3D)
  fps: 24
  resolution: [1920, 1080]
  blender:
    executable: blender
    engine: BLENDER_EEVEE_NEXT
    samples: 16
    parallel_jobs: 2          # rendus de scènes en parallèle (1 par GPU)
    asset_library: assets/library   # sets/*.blend, characters/*.blend
    animate_on_twos: false    # animation "en 2" : style cartoon + rendu 2x plus rapide

editing:
  burn_subtitles: true
  subtitle_style:
    font: DejaVu Sans
    size: 54
    outline: 3
    max_chars_per_line: 42
  music_bed: null             # chemin d'un fichier musical (ducking automatique sous les voix)
  cutdown:                    # extrait vertical pour Shorts / TikTok / Reels
    enabled: true
    max_seconds: 59
    resolution: [1080, 1920]

qa:
  min_risk_for_human: 0.3     # score >= seuil → revue humaine obligatoire
  always_human_review: true   # recommandé au démarrage ; passer à false une fois la confiance établie
  llm_content_review: true

review:
  channel: web                # web | telegram | cli
  web:
    host: 127.0.0.1
    port: 8765
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

publish:
  dry_run: true
  targets: [local]            # local | youtube | tiktok | instagram
  local_dir: out/published
  youtube:
    client_secrets: secrets/youtube_client.json
    privacy: private

learning:
  lessons_file: data/lessons.md
  max_lessons_in_prompt: 15
