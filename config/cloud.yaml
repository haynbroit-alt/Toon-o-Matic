# USINE CLOUD : COMMAND sur Render, VAULT sur Cloudflare R2, STUDIO à la demande.
# Secrets (jamais dans ce fichier) : TOONOMATIC_TOKEN, ANTHROPIC_API_KEY,
#   VAULT_ACCESS_KEY_ID, VAULT_SECRET_ACCESS_KEY, STUDIO_WEBHOOK_TOKEN
state: {backend: vault}
# PILOTE V1 : 1 décor, épisodes de 2 minutes (passer à 10–15 min une fois un personnage validé)
episode: {target_minutes: 2, min_minutes: 1.6, max_minutes: 2.6, minutes_per_scene: 0.5, allowed_sets: [rue]}
cadence: {episodes_per_day: 1}
vault:
  backend: s3
  fallback_local: true               # tant que R2 n'est pas configuré : vault local ÉPHÉMÈRE (signalé dans l'appli)
  s3:
    bucket: toonomatic
    endpoint_url: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
    region: auto
workdir: /tmp/toonomatic/runs        # disque de travail jetable
llm: {provider: auto, fallback: mock}     # modèles open source dont la clé est présente, puis Claude ; sinon mode démo
tts: {provider: piper, fallback: mock}      # vraies voix gratuites sur CPU ; bips si les voix sont absentes
plates: {provider: draw}                    # décors dessinés par le code (aucun serveur d'images requis)
# Sans GPU ni modèles 3D, TOUS les niveaux utilisent le théâtre de marionnettes 2D : brouillon en 480p,
# validation en 720p, final en 1080p. Passez `renderer: blender` au niveau final quand les modèles 3D existeront.
production:
  tiers:
    draft: {gpu: false, overrides: {tts: {provider: piper, fallback: mock}}}
    validation: {gpu: false, overrides: {animation: {renderer: puppet, resolution: [1280, 720]}, plates: {provider: draw}}}
    final: {gpu: false, overrides: {animation: {renderer: puppet, resolution: [1920, 1080]}, plates: {provider: draw}}}
studio:
  cpu_launcher: inline               # brouillons & validations : sur le serveur COMMAND (CPU)
  gpu_launcher: none                 # à activer seulement après validation de la chaîne en mode économique :
  # gpu_launcher: webhook            #   point d'entrée serverless GPU qui lance `toonomatic worker --gpu`
  # webhook: {url: "https://…", token_env: STUDIO_WEBHOOK_TOKEN}
  # gpu_launcher: command            #   ou n'importe quelle CLI de fournisseur
  # gpu_command: "./deploy/gpu-oneshot.sh {episode_id}"
