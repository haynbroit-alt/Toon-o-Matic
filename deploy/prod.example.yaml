# Copier en config/prod.yaml — surcharge de config/default.yaml pour la production
cadence: {episodes_per_day: 4}
llm: {provider: claude}          # ou ollama (100 % local)
tts: {provider: chatterbox}      # ou xtts / bark / http (Fish Speech, F5-TTS…)
animation:
  renderer: blender
  blender: {executable: /opt/blender/blender, parallel_jobs: 2, animate_on_twos: true}
editing: {music_bed: assets/music/theme_loop.mp3}
review: {channel: telegram}
qa: {always_human_review: true}
publish: {dry_run: false, targets: [local, youtube]}
