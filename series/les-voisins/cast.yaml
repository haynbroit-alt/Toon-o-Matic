# Distribution : les "acteurs" 3D récurrents — leur identité est PERSISTANTE (fiches, voix, rigs).
# rig      : fichier .blend dans asset_library/characters (sinon un avatar placeholder est généré)
# color    : couleur du placeholder / de l'animatique
# voices   : une voix par langue et par fournisseur TTS
characters:
  momo:
    personality: [optimiste incurable, mauvaise foi créative, cœur tendre]
    catchphrases: {fr: ["J'ai un plan.", "Fais-moi confiance."], en: ["I've got a plan.", "Trust me."]}
    look: "Grand, maigre, bonnet orange, blouson de livreur trop large, baskets usées. Silhouette en longueur."
    model_sheet: assets/model_sheets/momo.png
    signature: {accessories: [cap], outfit_color: "#e8833a", hair: "#2b1d14", skin: "#d9a066", head_scale: 1.3}
    display: Momo
    bio_fr: "Livreur à scooter, philosophe de comptoir, persuadé d'avoir toujours un plan."
    bio_en: "Scooter courier and armchair philosopher, always convinced he has a plan."
    rig: momo.blend
    color: "#e8833a"
    voices:
      fr: {xtts_speaker_wav: assets/voices/momo_fr.wav, chatterbox_ref: assets/voices/momo_fr.wav, bark_preset: v2/fr_speaker_1, elevenlabs_voice_id: "", mock_pitch: 180}
      en: {xtts_speaker_wav: assets/voices/momo_en.wav, chatterbox_ref: assets/voices/momo_en.wav, bark_preset: v2/en_speaker_6, elevenlabs_voice_id: "", mock_pitch: 170}
  lina:
    personality: [pragmatique, sarcastique, loyale malgré elle]
    catchphrases: {fr: ["Non.", "Je vais faire semblant de pas avoir entendu."], en: ["No.", "I'll pretend I didn't hear that."]}
    look: "Petite, lunettes rondes, chignon fixé par un crayon, salopette avec outils. Silhouette compacte."
    model_sheet: assets/model_sheets/lina.png
    signature: {accessories: [round_glasses], outfit_color: "#3a9be8", hair: "#4a2a1a", skin: "#c98e5e", head_scale: 1.25}
    display: Lina
    bio_fr: "Voisine du dessus, ingénieure, sarcastique, la seule adulte de la pièce."
    bio_en: "Upstairs neighbour, engineer, sarcastic, the only adult in the room."
    rig: lina.blend
    color: "#3a9be8"
    voices:
      fr: {xtts_speaker_wav: assets/voices/lina_fr.wav, chatterbox_ref: assets/voices/lina_fr.wav, bark_preset: v2/fr_speaker_2, elevenlabs_voice_id: "", mock_pitch: 260}
      en: {xtts_speaker_wav: assets/voices/lina_en.wav, chatterbox_ref: assets/voices/lina_en.wav, bark_preset: v2/en_speaker_9, elevenlabs_voice_id: "", mock_pitch: 250}
  tonton:
    personality: [placide, roublard, généreux à sa façon]
    catchphrases: {fr: ["Je connais quelqu'un.", "Doucement, doucement."], en: ["I know a guy.", "Easy, easy."]}
    look: "Massif, moustache grise, bleu de travail taché, toujours un chiffon à l'épaule. Silhouette en poire."
    model_sheet: assets/model_sheets/tonton.png
    signature: {accessories: [sunglasses, moustache], outfit_color: "#3d5a80", hair: "#b8b8b8", skin: "#d6a27a", head_scale: 1.5}
    display: Tonton Rachid
    bio_fr: "Le tonton qui connaît quelqu'un qui connaît quelqu'un. Garagiste. Jamais pressé."
    bio_en: "The uncle who knows a guy who knows a guy. Mechanic. Never in a hurry."
    rig: tonton.blend
    color: "#7bc96f"
    voices:
      fr: {xtts_speaker_wav: assets/voices/tonton_fr.wav, chatterbox_ref: assets/voices/tonton_fr.wav, bark_preset: v2/fr_speaker_5, elevenlabs_voice_id: "", mock_pitch: 120}
      en: {xtts_speaker_wav: assets/voices/tonton_en.wav, chatterbox_ref: assets/voices/tonton_en.wav, bark_preset: v2/en_speaker_3, elevenlabs_voice_id: "", mock_pitch: 115}

sets:
  # plate        : image 2D de fond (16:9, ≥ 1920 px), relative au dossier de la série. Générée si absente.
  # plate_prompt : description pour le générateur d'images (le style de la série est ajouté automatiquement).
  # blend        : décor 3D optionnel (prioritaire si backgrounds: sets).
  rue:      {blend: street.blend, plate: plates/rue.png, color: "#5b5f73", label_fr: "La rue", label_en: "The street",
             plate_prompt: "quiet suburban street, white houses with red tiled roofs, green hedges, brick garden wall, lamp post, bright blue sky"}
  salon:    {blend: living.blend, plate: plates/salon.png, color: "#8a6f5a", label_fr: "Le salon", label_en: "The living room",
             plate_prompt: "cosy modest living room, old sofa, low table, patterned rug, window with daylight, family photos"}
  voiture:  {blend: car.blend, plate: plates/voiture.png, color: "#4b6b5b", label_fr: "La voiture", label_en: "The car",
             plate_prompt: "interior of an old taxi seen from the back seat, worn brown seats, dashboard ornament, city through the windshield"}
  garage:   {blend: garage.blend, plate: plates/garage.png, color: "#6b5b4b", label_fr: "Le garage", label_en: "The garage",
             plate_prompt: "small car repair garage, red lift post, stacked tyres, metal shelves with oil cans, tool wall"}
  epicerie: {blend: shop.blend, plate: plates/epicerie.png, color: "#7a5b7a", label_fr: "L'épicerie", label_en: "The corner shop",
             plate_prompt: "tiny neighbourhood grocery store at night, crowded shelves, neon sign, counter with cash register"}

# Bibliothèque d'animations pré-enregistrées (actions NLA dans les rigs).
# Le LLM ne peut choisir QUE parmi ces clés : c'est ce qui rend la 3D pilotable par le texte.
actions:
  idle: "Debout, respiration"
  talk: "Parle normalement"
  talk_hands: "Parle en agitant les bras"
  angry: "S'énerve, poings serrés"
  facepalm: "Se tape le front"
  laugh: "Éclate de rire"
  shrug: "Hausse les épaules"
  point: "Montre du doigt"
  sit: "Assis"
  drive: "Conduit"
  walk_in: "Entre dans le champ"
  walk_out: "Sort du champ"
  phone: "Au téléphone"
  shocked: "Sursaute, choqué"

emotions: [neutral, happy, angry, sad, surprised, sarcastic, scared, smug]

# Visèmes (Rhubarb Lip Sync, notation Preston Blair) → shape keys des rigs : viseme_A … viseme_X
#   A: m/b/p (bouche fermée)  B: k/s/t/ee  C: e/a ouvert  D: a grand ouvert  E: o arrondi
#   F: u/oo/w  G: f/v  H: l (langue)  X: repos
visemes: [A, B, C, D, E, F, G, H, X]
